[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alt-data-sentiment"
version = "0.1.0"
description = "Reddit (WSB + r/stocks) sentiment as an alternative-data factor on S&P 500"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qtools @ git+https://github.com/matthiola0/qtools.git@v0.3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "seaborn>=0.13",
    "jupyterlab>=4.0",
    "nbformat>=5.9",
    "requests>=2.31",
    "lxml>=5.0",
    "kaggle>=1.6",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/alt_sentiment"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
